<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="ko">
<head>
    <meta charset="UTF-8">
    <title>상품 관리</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
    <!-- 공통 상단 내비게이션 -->
    <div th:replace="~{fragments/header :: topbar('products')}"></div>

    <div class="container">
        <h1 class="page-title">상품 관리</h1>
        <p class="page-desc">상품을 검색하고 등록·삭제할 수 있습니다.</p>

        <!-- 상품 검색 -->
        <div class="card">
            <h2>상품 검색</h2>
            <form class="form-row" th:action="@{/view/products}" method="get">
                <input type="text" name="keyword" placeholder="상품명 검색" th:value="${keyword}">
                <button type="submit" class="btn btn-primary">검색</button>
                <a class="btn btn-outline" th:href="@{/view/products}">전체 보기</a>
            </form>
        </div>

        <!-- 상품 등록 -->
        <div class="card">
            <h2>상품 등록</h2>
            <form class="form-row" th:action="@{/view/products}" method="post">
                <input type="text" name="name" placeholder="상품명" required>
                <input type="number" name="price" placeholder="가격" required min="0">
                <input type="number" name="stockQuantity" placeholder="재고 수량" required min="0">
                <input type="text" name="description" placeholder="상품 설명">
                <button type="submit" class="btn btn-primary">등록</button>
            </form>
        </div>

        <!-- 상품 목록 -->
        <div class="card">
            <h2>상품 목록</h2>
            <table>
                <thead>
                    <tr>
                        <th>ID</th>
                        <th>상품명</th>
                        <th>가격</th>
                        <th>재고</th>
                        <th>상태</th>
                        <th>설명</th>
                        <th>관리</th>
                    </tr>
                </thead>
                <tbody>
                    <tr th:each="product : ${products}">
                        <td th:text="${product.id}"></td>
                        <td th:text="${product.name}"></td>
                        <td th:text="${#numbers.formatInteger(product.price, 3, 'COMMA')} + '원'"></td>
                        <td th:text="${product.stockQuantity}"></td>
                        <td th:text="${product.status}"></td>
                        <td th:text="${product.description}"></td>
                        <td>
                            <form style="display:inline" th:action="@{/view/products/{id}/delete(id=${product.id})}" method="post">
                                <button type="submit" class="btn-delete">삭제</button>
                            </form>
                        </td>
                    </tr>
                    <tr class="empty-row" th:if="${#lists.isEmpty(products)}">
                        <td colspan="7">등록된 상품이 없습니다.</td>
                    </tr>
                </tbody>
            </table>
        </div>
    </div>
</body>
</html>
