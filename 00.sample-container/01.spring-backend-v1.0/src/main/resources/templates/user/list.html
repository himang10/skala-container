<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="ko">
<head>
    <meta charset="UTF-8">
    <title>사용자 관리</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
    <!-- 공통 상단 내비게이션 -->
    <div th:replace="~{fragments/header :: topbar('users')}"></div>

    <div class="container">
        <h1 class="page-title">사용자 관리</h1>
        <p class="page-desc">사용자를 검색하고 등록·삭제할 수 있습니다.</p>

        <!-- 사용자 검색 -->
        <div class="card">
            <h2>사용자 검색</h2>
            <form class="form-row" th:action="@{/view/users}" method="get">
                <input type="text" name="keyword" placeholder="이름 검색" th:value="${keyword}">
                <button type="submit" class="btn btn-primary">검색</button>
                <a class="btn btn-outline" th:href="@{/view/users}">전체 보기</a>
            </form>
        </div>

        <!-- 사용자 등록 -->
        <div class="card">
            <h2>사용자 등록</h2>
            <form class="form-row" th:action="@{/view/users}" method="post">
                <input type="text" name="name" placeholder="이름" required>
                <input type="email" name="email" placeholder="이메일" required>
                <button type="submit" class="btn btn-primary">등록</button>
            </form>
        </div>

        <!-- 사용자 목록 -->
        <div class="card">
            <h2>사용자 목록</h2>
            <table>
                <thead>
                    <tr>
                        <th>ID</th>
                        <th>이름</th>
                        <th>이메일</th>
                        <th>관리</th>
                    </tr>
                </thead>
                <tbody>
                    <tr th:each="user : ${users}">
                        <td th:text="${user.id}"></td>
                        <td th:text="${user.name}"></td>
                        <td th:text="${user.email}"></td>
                        <td>
                            <form style="display:inline" th:action="@{/view/users/{id}/delete(id=${user.id})}" method="post">
                                <button type="submit" class="btn-delete">삭제</button>
                            </form>
                        </td>
                    </tr>
                    <tr class="empty-row" th:if="${#lists.isEmpty(users)}">
                        <td colspan="4">등록된 사용자가 없습니다.</td>
                    </tr>
                </tbody>
            </table>
        </div>
    </div>
</body>
</html>
