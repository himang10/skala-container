<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="ko">
<head>
    <meta charset="UTF-8">
    <title>주문 관리</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
    <!-- 공통 상단 내비게이션 -->
    <div th:replace="~{fragments/header :: topbar('orders')}"></div>

    <div class="container">
        <h1 class="page-title">주문 관리</h1>
        <p class="page-desc">상품을 주문하고, 상태 버튼을 눌러 결제·배송 단계를 진행합니다.</p>

        <!-- 1단계: 상품 목록에서 주문 버튼 클릭 -->
        <div class="card">
            <h2>상품 목록</h2>
            <table>
                <thead>
                    <tr>
                        <th>ID</th>
                        <th>상품명</th>
                        <th>가격</th>
                        <th>재고</th>
                        <th>주문</th>
                    </tr>
                </thead>
                <tbody>
                    <tr th:each="product : ${products}">
                        <td th:text="${product.id}"></td>
                        <td th:text="${product.name}"></td>
                        <td th:text="${#numbers.formatInteger(product.price, 3, 'COMMA')} + '원'"></td>
                        <td th:text="${product.stockQuantity}"></td>
                        <td>
                            <a class="btn btn-primary btn-sm" th:href="@{/view/orders/new(productId=${product.id})}">주문</a>
                        </td>
                    </tr>
                    <tr class="empty-row" th:if="${#lists.isEmpty(products)}">
                        <td colspan="5">등록된 상품이 없습니다. 상품 관리에서 먼저 등록하세요.</td>
                    </tr>
                </tbody>
            </table>
        </div>

        <!-- 2단계: 주문 목록에서 상태 버튼 클릭 → 다음 상태로 전환 -->
        <div class="card">
            <h2>주문 목록</h2>
            <p class="page-desc">상태 버튼을 클릭하면 다음 단계로 진행됩니다.
                (주문 완료 → 결제 대기 → 결제 완료 → 배송 대기 → 배송 완료)</p>
            <table>
                <thead>
                    <tr>
                        <th>ID</th>
                        <th>사용자</th>
                        <th>상품</th>
                        <th>수량</th>
                        <th>결제 금액</th>
                        <th>주문 시각</th>
                        <th>현재 상태</th>
                    </tr>
                </thead>
                <tbody>
                    <tr th:each="order : ${orders}">
                        <td th:text="${order.id}"></td>
                        <td th:text="${order.user.name}"></td>
                        <td th:text="${order.product.name}"></td>
                        <td th:text="${order.quantity}"></td>
                        <td th:text="${#numbers.formatInteger(order.payment.amount, 3, 'COMMA')} + '원'"></td>
                        <td th:text="${#temporals.format(order.orderedAt, 'yyyy-MM-dd HH:mm')}"></td>
                        <td>
                            <!-- 마지막 상태(배송 완료)면 버튼 대신 배지로 표시 -->
                            <span th:if="${order.status.name() == 'DELIVERY_COMPLETED'}"
                                  class="badge badge-done" th:text="${order.status.label}"></span>
                            <form th:unless="${order.status.name() == 'DELIVERY_COMPLETED'}"
                                  style="display:inline" th:action="@{/view/orders/{id}/next(id=${order.id})}" method="post">
                                <button type="submit" class="btn btn-primary btn-sm" th:text="${order.status.label}"></button>
                            </form>
                        </td>
                    </tr>
                    <tr class="empty-row" th:if="${#lists.isEmpty(orders)}">
                        <td colspan="7">주문이 없습니다.</td>
                    </tr>
                </tbody>
            </table>
        </div>
    </div>
</body>
</html>
