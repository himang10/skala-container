<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>시스템 정보</title>
    <link rel="stylesheet" href="/css/style.css">
</head>
<body>
    <header class="topbar">
        <div class="topbar-inner">
            <a class="logo" href="/index.html">SK <span class="accent">AX</span> 주문 관리</a>
            <nav>
                <a href="/index.html">홈</a>
                <a href="/products.html">상품 관리</a>
                <a href="/users.html">사용자 관리</a>
                <a href="/orders.html">주문 관리</a>
                <a href="/system.html" class="active">시스템 정보</a>
            </nav>
        </div>
    </header>

    <div class="container">
        <h1 class="page-title">시스템 정보</h1>
        <p class="page-desc">
            이 화면은 01과 달리 nginx 프록시를 거치지 않고,
            <b>브라우저가 02.fastapi-backend-v2.0을 직접 호출</b>합니다.<br>
            그래서 02 쪽에 CORS(Cross-Origin Resource Sharing) 허용 설정이 되어 있어야 정상 조회됩니다.
        </p>
        <p class="page-desc">02 서버 주소: <code id="backendV2UrlText"></code></p>

        <!-- 02 서버 정보 -->
        <div class="card">
            <h2>02 서버 정보</h2>
            <button type="button" class="btn btn-primary" id="loadInfoBtn">조회</button>
            <table>
                <tbody>
                    <tr><th>hostname</th><td id="infoHostname">-</td></tr>
                    <tr><th>pod ip</th><td id="infoPodIp">-</td></tr>
                    <tr><th>liveness</th><td id="infoLiveness">-</td></tr>
                    <tr><th>readiness</th><td id="infoReadiness">-</td></tr>
                </tbody>
            </table>
        </div>

        <!-- 02가 자체 관리하는 사용자 목록 (인메모리) -->
        <div class="card">
            <h2>02 사용자 목록 (인메모리)</h2>
            <button type="button" class="btn btn-primary" id="loadUsersBtn">조회</button>
            <table>
                <thead>
                    <tr><th>ID</th><th>이름</th><th>이메일</th></tr>
                </thead>
                <tbody id="usersBody">
                    <tr class="empty-row"><td colspan="3">[조회] 버튼을 눌러 확인하세요.</td></tr>
                </tbody>
            </table>
        </div>
    </div>

    <script src="/js/system.js"></script>
</body>
</html>
