<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>주문 - 사용자 선택</title>
    <link rel="stylesheet" href="/css/style.css">
</head>
<body>
    <header class="topbar">
        <div class="topbar-inner">
            <a class="logo" href="/index.html">SK <span class="accent">AX</span> 주문 관리</a>
            <nav>
                <a href="/index.html">홈</a>
                <a href="/products.html">상품 관리</a>
                <a href="/users.html">사용자 관리</a>
                <a href="/orders.html" class="active">주문 관리</a>
                <a href="/system.html">시스템 정보</a>
            </nav>
        </div>
    </header>

    <div class="container">
        <h1 class="page-title">주문 - 사용자 선택</h1>
        <p class="page-desc">주문할 사용자를 선택하고 수량·배송지를 입력한 뒤 주문을 확정하세요.</p>

        <!-- 주문할 상품 정보 -->
        <div class="card">
            <h2>주문 상품</h2>
            <table>
                <thead>
                    <tr><th>상품명</th><th>가격</th><th>재고</th></tr>
                </thead>
                <tbody id="productBody">
                    <tr class="empty-row"><td colspan="3">불러오는 중...</td></tr>
                </tbody>
            </table>
        </div>

        <!-- 사용자 선택 후 OK(주문 확정)하면 주문 완료 -->
        <div class="card">
            <h2>주문 정보 입력</h2>
            <form id="orderForm">
                <div class="field">
                    <label for="userId">사용자</label>
                    <select id="userId" name="userId" required>
                        <option value="" disabled selected>-- 사용자 선택 --</option>
                    </select>
                </div>

                <div class="field">
                    <label for="quantity">수량</label>
                    <input type="number" id="quantity" name="quantity" value="1" min="1" required>
                </div>

                <div class="field">
                    <label for="address">배송지</label>
                    <input type="text" id="address" name="address" placeholder="배송지 주소" style="width: 320px;">
                </div>

                <button type="submit" class="btn btn-primary">주문 확정 (OK)</button>
                <a class="btn btn-outline" href="/orders.html">취소</a>
            </form>
        </div>
    </div>

    <script src="/js/api.js"></script>
    <script src="/js/order-new.js"></script>
</body>
</html>
