<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>상품 관리</title>
    <link rel="stylesheet" href="/css/style.css">
</head>
<body>
    <header class="topbar">
        <div class="topbar-inner">
            <a class="logo" href="/index.html">SK <span class="accent">AX</span> 주문 관리</a>
            <nav>
                <a href="/index.html">홈</a>
                <a href="/products.html" class="active">상품 관리</a>
                <a href="/users.html">사용자 관리</a>
                <a href="/orders.html">주문 관리</a>
                <a href="/system.html">시스템 정보</a>
            </nav>
        </div>
    </header>

    <div class="container">
        <h1 class="page-title">상품 관리</h1>
        <p class="page-desc">상품을 검색하고 등록·삭제할 수 있습니다.</p>

        <!-- 상품 검색 -->
        <div class="card">
            <h2>상품 검색</h2>
            <form class="form-row" id="searchForm">
                <input type="text" id="searchKeyword" placeholder="상품명 검색">
                <button type="submit" class="btn btn-primary">검색</button>
                <button type="button" class="btn btn-outline" id="resetBtn">전체 보기</button>
            </form>
        </div>

        <!-- 상품 등록 -->
        <div class="card">
            <h2>상품 등록</h2>
            <form class="form-row" id="createForm">
                <input type="text" name="name" placeholder="상품명" required>
                <input type="number" name="price" placeholder="가격" required min="0">
                <input type="number" name="stockQuantity" placeholder="재고 수량" required min="0">
                <input type="text" name="description" placeholder="상품 설명">
                <button type="submit" class="btn btn-primary">등록</button>
            </form>
        </div>

        <!-- 상품 목록 -->
        <div class="card">
            <h2>상품 목록</h2>
            <table>
                <thead>
                    <tr>
                        <th>ID</th>
                        <th>상품명</th>
                        <th>가격</th>
                        <th>재고</th>
                        <th>상태</th>
                        <th>설명</th>
                        <th>관리</th>
                    </tr>
                </thead>
                <tbody id="productBody">
                    <tr class="empty-row"><td colspan="7">불러오는 중...</td></tr>
                </tbody>
            </table>
        </div>
    </div>

    <script src="/js/api.js"></script>
    <script src="/js/products.js"></script>
</body>
</html>
