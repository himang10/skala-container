<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="ko">
<head>
    <meta charset="UTF-8">
    <title>주문 - 사용자 선택</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
    <!-- 공통 상단 내비게이션 -->
    <div th:replace="~{fragments/header :: topbar('orders')}"></div>

    <div class="container">
        <h1 class="page-title">주문 - 사용자 선택</h1>
        <p class="page-desc">주문할 사용자를 선택하고 수량·배송지를 입력한 뒤 주문을 확정하세요.</p>

        <!-- 주문할 상품 정보 -->
        <div class="card">
            <h2>주문 상품</h2>
            <table>
                <thead>
                    <tr>
                        <th>상품명</th>
                        <th>가격</th>
                        <th>재고</th>
                    </tr>
                </thead>
                <tbody>
                    <tr>
                        <td th:text="${product.name}"></td>
                        <td th:text="${#numbers.formatInteger(product.price, 3, 'COMMA')} + '원'"></td>
                        <td th:text="${product.stockQuantity}"></td>
                    </tr>
                </tbody>
            </table>
        </div>

        <!-- 사용자 선택 후 OK(주문 확정)하면 주문 완료 -->
        <div class="card">
            <h2>주문 정보 입력</h2>
            <form th:action="@{/view/orders}" method="post">
                <input type="hidden" name="productId" th:value="${product.id}">

                <div class="field">
                    <label for="userId">사용자</label>
                    <select id="userId" name="userId" required>
                        <option value="" disabled selected>-- 사용자 선택 --</option>
                        <option th:each="user : ${users}"
                                th:value="${user.id}"
                                th:text="${user.name + ' (' + user.email + ')'}"></option>
                    </select>
                </div>

                <div class="field">
                    <label for="quantity">수량</label>
                    <input type="number" id="quantity" name="quantity" value="1" min="1" required>
                </div>

                <div class="field">
                    <label for="address">배송지</label>
                    <input type="text" id="address" name="address" placeholder="배송지 주소" style="width: 320px;">
                </div>

                <button type="submit" class="btn btn-primary">주문 확정 (OK)</button>
                <a class="btn btn-outline" th:href="@{/view/orders}">취소</a>
            </form>
        </div>
    </div>
</body>
</html>
