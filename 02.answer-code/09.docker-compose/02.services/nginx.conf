server {
    listen 80;

    # 정적 파일 제공
    location / {
        root  /usr/share/nginx/html;
        index index.html;
    }

    # 백엔드 API 프록시: /api/* → backend:8080/*
    location /api/ {
        proxy_pass         http://backend:8080/;
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
    }
}
