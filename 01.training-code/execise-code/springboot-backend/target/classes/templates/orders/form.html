<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org"
      th:replace="~{fragments/layout :: layout('주문 생성', ~{::section})}">
<head><title>주문 생성</title></head>
<body>
<section>
  <div class="page-header">
    <nav aria-label="breadcrumb">
      <ol class="breadcrumb">
        <li class="breadcrumb-item"><a th:href="@{/web/orders}">주문 관리</a></li>
        <li class="breadcrumb-item active">새 주문</li>
      </ol>
    </nav>
    <h2><i class="bi bi-bag-plus me-2"></i>주문 생성</h2>
  </div>

  <div class="row g-4">
    <div class="col-lg-8">
      <div class="card">
        <div class="card-header bg-white py-3">
          <h5 class="mb-0"><i class="bi bi-cart me-2 text-warning"></i>주문 정보 입력</h5>
        </div>
        <div class="card-body p-4">
          <form id="orderForm" th:action="@{/web/orders}" method="post">

            <!-- 주문자 선택 -->
            <div class="mb-4">
              <label class="form-label fw-semibold">
                주문자 <span class="text-danger">*</span>
              </label>
              <select name="userId" class="form-select" required>
                <option value="">-- 주문자를 선택하세요 --</option>
                <option th:each="u : ${users}" th:value="${u.id}"
                        th:text="${u.name} + ' (' + ${u.email} + ')'">사용자</option>
              </select>
            </div>

            <!-- 주문 항목 -->
            <div class="mb-3">
              <div class="d-flex justify-content-between align-items-center mb-2">
                <label class="form-label fw-semibold mb-0">
                  주문 항목 <span class="text-danger">*</span>
                </label>
                <button type="button" class="btn btn-sm btn-outline-warning" id="addItemBtn">
                  <i class="bi bi-plus-circle me-1"></i>항목 추가
                </button>
              </div>

              <div id="orderItems">
                <!-- 첫 번째 기본 항목 -->
                <div class="order-item border rounded p-3 mb-2 bg-light">
                  <div class="row g-2 align-items-center">
                    <div class="col-7">
                      <select name="productId" class="form-select form-select-sm" required>
                        <option value="">-- 상품 선택 --</option>
                        <option th:each="p : ${products}" th:value="${p.id}"
                                th:text="${p.name} + ' (' + ${#numbers.formatInteger(p.price, 0, 'COMMA')} + '원, 재고:' + ${p.stockQuantity} + ')'">
                          상품
                        </option>
                      </select>
                    </div>
                    <div class="col-3">
                      <div class="input-group input-group-sm">
                        <input type="number" name="quantity"
                               class="form-control" min="1" value="1" required/>
                        <span class="input-group-text">개</span>
                      </div>
                    </div>
                    <div class="col-2">
                      <button type="button" class="btn btn-sm btn-outline-danger remove-item w-100"
                              style="display:none;">
                        <i class="bi bi-trash"></i>
                      </button>
                    </div>
                  </div>
                </div>
              </div>
            </div>

            <div class="d-flex gap-2 mt-4">
              <button type="submit" class="btn btn-warning text-dark flex-grow-1 fw-semibold">
                <i class="bi bi-bag-check me-1"></i>주문 생성
              </button>
              <a th:href="@{/web/orders}" class="btn btn-outline-secondary flex-grow-1">
                <i class="bi bi-x-circle me-1"></i>취소
              </a>
            </div>
          </form>
        </div>
      </div>
    </div>

    <!-- 안내 패널 -->
    <div class="col-lg-4">
      <div class="card border-warning">
        <div class="card-header bg-warning bg-opacity-10">
          <h6 class="mb-0 fw-bold text-warning"><i class="bi bi-info-circle me-2"></i>주문 안내</h6>
        </div>
        <div class="card-body">
          <ul class="list-unstyled mb-0 small text-muted">
            <li class="mb-2"><i class="bi bi-dot text-warning"></i>주문자와 최소 1개 이상의 상품을 선택하세요.</li>
            <li class="mb-2"><i class="bi bi-dot text-warning"></i>재고가 충분한 상품만 주문 가능합니다.</li>
            <li class="mb-2"><i class="bi bi-dot text-warning"></i>주문 생성 후 <strong>PENDING</strong> 상태로 시작됩니다.</li>
            <li class="mb-2"><i class="bi bi-dot text-warning"></i>상태 전환: PENDING → CONFIRMED → SHIPPED → DELIVERED</li>
            <li><i class="bi bi-dot text-warning"></i>취소는 PENDING 상태에서만 가능합니다.</li>
          </ul>
        </div>
      </div>
    </div>
  </div>
</section>

<script th:inline="javascript">
  let itemIndex = 1;
  const products = /*[[${products}]]*/ [];

  document.getElementById('addItemBtn').addEventListener('click', function () {
    const container = document.getElementById('orderItems');
    const idx = itemIndex++;

    const options = products.map(p =>
      `<option value="${p.id}">${p.name} (${p.price.toLocaleString()}원, 재고:${p.stockQuantity})</option>`
    ).join('');

    const html = `
      <div class="order-item border rounded p-3 mb-2 bg-light">
        <div class="row g-2 align-items-center">
          <div class="col-7">
            <select name="productId" class="form-select form-select-sm" required>
              <option value="">-- 상품 선택 --</option>
              ${options}
            </select>
          </div>
          <div class="col-3">
            <div class="input-group input-group-sm">
              <input type="number" name="quantity"
                     class="form-control" min="1" value="1" required/>
              <span class="input-group-text">개</span>
            </div>
          </div>
          <div class="col-2">
            <button type="button" class="btn btn-sm btn-outline-danger remove-item w-100">
              <i class="bi bi-trash"></i>
            </button>
          </div>
        </div>
      </div>`;
    container.insertAdjacentHTML('beforeend', html);
    updateRemoveButtons();
  });

  document.getElementById('orderItems').addEventListener('click', function (e) {
    if (e.target.closest('.remove-item')) {
      e.target.closest('.order-item').remove();
      updateRemoveButtons();
    }
  });

  function updateRemoveButtons() {
    const items = document.querySelectorAll('.order-item');
    items.forEach((item, i) => {
      const btn = item.querySelector('.remove-item');
      btn.style.display = items.length > 1 ? 'block' : 'none';
    });
  }
</script>
</body>
</html>
