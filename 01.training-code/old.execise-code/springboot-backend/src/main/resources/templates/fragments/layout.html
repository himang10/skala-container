<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org" th:fragment="layout(title, content)">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title th:text="${title} + ' | SK Skala Shop'">SK Skala Shop</title>
  <!-- Bootstrap 5 -->
  <link rel="stylesheet"
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"/>
  <!-- Bootstrap Icons -->
  <link rel="stylesheet"
        href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css"/>
  <style>
    body { background-color: #f8f9fa; }
    .sidebar {
      min-height: 100vh;
      background: linear-gradient(180deg, #1a237e 0%, #283593 100%);
    }
    .sidebar .nav-link {
      color: rgba(255,255,255,.75);
      border-radius: 8px;
      margin: 2px 0;
      transition: all .2s;
    }
    .sidebar .nav-link:hover, .sidebar .nav-link.active {
      color: #fff;
      background-color: rgba(255,255,255,.15);
    }
    .sidebar .nav-link i { width: 20px; text-align: center; }
    .sidebar-brand {
      color: #fff;
      font-size: 1.25rem;
      font-weight: 700;
      padding: 1.5rem 1rem 1rem;
      border-bottom: 1px solid rgba(255,255,255,.2);
      margin-bottom: .5rem;
    }
    .content-wrapper { padding: 2rem; }
    .card { border: none; border-radius: 12px; box-shadow: 0 2px 12px rgba(0,0,0,.08); }
    .card-header { border-radius: 12px 12px 0 0 !important; }
    .badge-status-PENDING    { background-color: #ffc107; color:#000; }
    .badge-status-CONFIRMED  { background-color: #0d6efd; color:#fff; }
    .badge-status-SHIPPED    { background-color: #0dcaf0; color:#000; }
    .badge-status-DELIVERED  { background-color: #198754; color:#fff; }
    .badge-status-CANCELLED  { background-color: #dc3545; color:#fff; }
    .page-header { margin-bottom: 1.5rem; }
    .page-header h2 { font-weight: 700; color: #1a237e; }
    .btn-primary { background-color: #1a237e; border-color: #1a237e; }
    .btn-primary:hover { background-color: #283593; border-color: #283593; }
    .table thead th { background-color: #e8eaf6; color: #1a237e; font-weight: 600; }
    .alert { border-radius: 10px; }
    .stat-card { border-left: 4px solid; }
    .stat-card-blue { border-left-color: #1a237e; }
    .stat-card-green { border-left-color: #198754; }
    .stat-card-orange { border-left-color: #fd7e14; }
    .stat-card-red { border-left-color: #dc3545; }
  </style>
</head>
<body>
  <div class="d-flex">
    <!-- 사이드바 -->
    <nav class="sidebar d-flex flex-column p-3" style="width:220px; min-width:220px;">
      <div class="sidebar-brand">
        <i class="bi bi-shop me-2"></i>SK Skala Shop
      </div>
      <ul class="nav flex-column gap-1">
        <li class="nav-item">
          <a class="nav-link" th:href="@{/}" th:classappend="${currentPage=='home'} ? 'active'">
            <i class="bi bi-house me-2"></i>대시보드
          </a>
        </li>
        <li class="nav-item mt-2">
          <small class="text-white-50 px-2 text-uppercase" style="font-size:.7rem;">관리</small>
        </li>
        <li class="nav-item">
          <a class="nav-link" th:href="@{/web/users}" th:classappend="${currentPage=='users'} ? 'active'">
            <i class="bi bi-people me-2"></i>사용자 관리
          </a>
        </li>
        <li class="nav-item">
          <a class="nav-link" th:href="@{/web/categories}" th:classappend="${currentPage=='categories'} ? 'active'">
            <i class="bi bi-grid me-2"></i>카테고리 관리
          </a>
        </li>
        <li class="nav-item">
          <a class="nav-link" th:href="@{/web/orders}" th:classappend="${currentPage=='orders'} ? 'active'">
            <i class="bi bi-bag me-2"></i>주문 관리
          </a>
        </li>
        <li class="nav-item mt-3">
          <small class="text-white-50 px-2 text-uppercase" style="font-size:.7rem;">링크</small>
        </li>
        <li class="nav-item">
          <a class="nav-link" href="/swagger-ui.html" target="_blank">
            <i class="bi bi-code-slash me-2"></i>Swagger UI
          </a>
        </li>
        <li class="nav-item">
          <a class="nav-link" href="/actuator/health" target="_blank">
            <i class="bi bi-heart-pulse me-2"></i>Health Check
          </a>
        </li>
      </ul>
    </nav>

    <!-- 메인 콘텐츠 -->
    <main class="flex-grow-1 content-wrapper">
      <!-- 알림 메시지 -->
      <div th:if="${successMsg}" class="alert alert-success alert-dismissible fade show" role="alert">
        <i class="bi bi-check-circle me-2"></i>
        <span th:text="${successMsg}"></span>
        <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
      </div>
      <div th:if="${errorMsg}" class="alert alert-danger alert-dismissible fade show" role="alert">
        <i class="bi bi-exclamation-triangle me-2"></i>
        <span th:text="${errorMsg}"></span>
        <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
      </div>

      <!-- 페이지 본문 -->
      <div th:replace="${content}">페이지 내용</div>
    </main>
  </div>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
