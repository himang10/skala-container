<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <title>사용자 관리</title>
  <style>
    body { font-family: sans-serif; max-width: 780px; margin: 40px auto; padding: 0 16px; }
    h1 { color: #333; }
    h2 { color: #555; font-size: 16px; margin: 28px 0 10px; border-bottom: 2px solid #4f8ef7; padding-bottom: 4px; }
    .row { display: flex; gap: 8px; margin-bottom: 8px; flex-wrap: wrap; }
    .row input[type="number"] { max-width: 90px; }
    input { flex: 1; padding: 8px; font-size: 14px; border: 1px solid #ccc; border-radius: 4px; min-width: 0; }
    input:disabled { background: #f0f0f0; color: #888; }
    button { padding: 8px 14px; font-size: 14px; border: none; border-radius: 4px; cursor: pointer; white-space: nowrap; }
    .btn-primary  { background: #4f8ef7; color: #fff; }
    .btn-primary:hover  { background: #3a6fd8; }
    .btn-success  { background: #28a745; color: #fff; }
    .btn-success:hover  { background: #1e7e34; }
    .btn-warning  { background: #fd7e14; color: #fff; }
    .btn-warning:hover  { background: #e06000; }
    .btn-danger   { background: #dc3545; color: #fff; }
    .btn-danger:hover   { background: #b02030; }
    .btn-secondary { background: #6c757d; color: #fff; }
    .btn-secondary:hover { background: #545b62; }
    table { width: 100%; border-collapse: collapse; margin-top: 12px; }
    th, td { border: 1px solid #ddd; padding: 9px; text-align: left; font-size: 14px; }
    th { background: #f5f5f5; }
    tr.selected { background: #e8f0fe; }
    .msg { margin-top: 8px; font-size: 13px; }
    .error   { color: red; }
    .success { color: green; }
  </style>
</head>
<body>
  <h1>사용자 관리</h1>

  <!-- 사용자 등록/변경 -->
  <h2>사용자 등록/변경</h2>
  <div class="row">
    <input id="regId"    type="number" placeholder="ID" disabled />
    <input id="regName"  type="text"   placeholder="이름" />
    <input id="regEmail" type="email"  placeholder="이메일" />
    <button class="btn-success"   onclick="saveUser()">등록</button>
    <button class="btn-warning"   onclick="saveUser()" id="btnUpdate" style="display:none">변경</button>
    <button class="btn-secondary" onclick="resetForm()">초기화</button>
  </div>
  <p class="msg" id="reg-msg"></p>

  <!-- 사용자 검색 -->
  <h2>사용자 검색</h2>
  <div class="row">
    <input id="searchId" type="number" placeholder="User ID" />
    <button class="btn-primary" onclick="search()">검색</button>
    <button class="btn-primary" onclick="loadAll()">전체 조회</button>
  </div>
  <p class="msg error" id="search-msg"></p>

  <table>
    <thead>
      <tr><th>ID</th><th>이름</th><th>이메일</th><th>생성일</th><th>삭제</th></tr>
    </thead>
    <tbody id="result-body"></tbody>
  </table>

  <script>
    const BASE = '/api';
    let selectedId = null;

    async function apiFetch(path, options) {
      const res = await fetch(BASE + path, options);
      if (!res.ok) {
        const err = await res.json().catch(() => ({}));
        throw new Error(err.detail ?? `HTTP ${res.status}`);
      }
      return res.json();
    }

    function renderRows(users) {
      const list = Array.isArray(users) ? users : [users];
      document.getElementById('result-body').innerHTML = list.map(u => `
        <tr id="row-${u.id}" onclick="selectRow(${u.id}, '${u.name}', '${u.email}')">
          <td>${u.id}</td>
          <td>${u.name}</td>
          <td>${u.email}</td>
          <td>${u.created_at ?? '-'}</td>
          <td><button class="btn-danger" onclick="deleteUser(event, ${u.id})">삭제</button></td>
        </tr>`).join('');
      document.getElementById('search-msg').textContent = '';
    }

    function selectRow(id, name, email) {
      // 이전 선택 해제
      if (selectedId) {
        const prev = document.getElementById('row-' + selectedId);
        if (prev) prev.classList.remove('selected');
      }
      selectedId = id;
      document.getElementById('row-' + id)?.classList.add('selected');

      // 폼에 데이터 채우기 (변경 모드)
      document.getElementById('regId').value    = id;
      document.getElementById('regName').value  = name;
      document.getElementById('regEmail').value = email;
      document.getElementById('btnUpdate').style.display = '';
      document.querySelector('button.btn-success').style.display = 'none';
      document.getElementById('reg-msg').textContent = '';
    }

    function resetForm() {
      selectedId = null;
      document.getElementById('regId').value    = '';
      document.getElementById('regName').value  = '';
      document.getElementById('regEmail').value = '';
      document.getElementById('btnUpdate').style.display = 'none';
      document.querySelector('button.btn-success').style.display = '';
      document.getElementById('reg-msg').textContent = '';
      document.querySelectorAll('tr.selected').forEach(r => r.classList.remove('selected'));
    }

    async function saveUser() {
      const id    = document.getElementById('regId').value.trim();
      const name  = document.getElementById('regName').value.trim();
      const email = document.getElementById('regEmail').value.trim();
      const msgEl = document.getElementById('reg-msg');

      if (!name || !email) {
        msgEl.className = 'msg error';
        msgEl.textContent = '이름과 이메일을 모두 입력하세요.';
        return;
      }
      try {
        let user;
        if (id) {
          // 변경 (PUT)
          user = await apiFetch('/users/' + id, {
            method: 'PUT',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ name, email })
          });
          msgEl.className = 'msg success';
          msgEl.textContent = `변경 완료 — ID: ${user.id}, ${user.name} (${user.email})`;
        } else {
          // 등록 (POST)
          user = await apiFetch('/users', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ name, email })
          });
          msgEl.className = 'msg success';
          msgEl.textContent = `등록 완료 — ID: ${user.id}, ${user.name} (${user.email})`;
        }
        resetForm();
        await loadAll();
      } catch (e) {
        msgEl.className = 'msg error';
        msgEl.textContent = (id ? '변경' : '등록') + ' 실패: ' + e.message;
      }
    }

    async function deleteUser(event, id) {
      event.stopPropagation();  // 행 클릭 이벤트 차단
      if (!confirm(`ID ${id} 사용자를 삭제하시겠습니까?`)) return;
      try {
        await apiFetch('/users/' + id, { method: 'DELETE' });
        if (selectedId === id) resetForm();
        await loadAll();
      } catch (e) {
        document.getElementById('search-msg').textContent = '삭제 실패: ' + e.message;
      }
    }

    async function loadAll() {
      try {
        renderRows(await apiFetch('/users'));
      } catch (e) {
        document.getElementById('search-msg').textContent = '오류: ' + e.message;
      }
    }

    async function search() {
      const id = document.getElementById('searchId').value.trim();
      try {
        renderRows(id ? await apiFetch('/users/' + id) : await apiFetch('/users'));
      } catch (e) {
        document.getElementById('search-msg').textContent = '오류: ' + e.message;
      }
    }

    loadAll();
  </script>
</body>
</html>
