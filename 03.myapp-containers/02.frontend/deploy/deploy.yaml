apiVersion: apps/v1
kind: Deployment
metadata:
  name: sk199-myfirst-api-server
  namespace: class-3
spec:
  replicas: 1
  selector:
    matchLabels:
      app: sk199-myfirst-api-server
  template:
    metadata:
      annotations:
        prometheus.io/scrape: 'true'
        prometheus.io/port: '8080'
        prometheus.io/path: '/prometheus'
        update: e8c24298b888a2dc0795de1564bca2da12
      labels:
        app: sk199-myfirst-api-server
    spec:
      containers:
      - name: sk199-myfirst-api-server
        image: amdp-registry.skala-ai.com/skala25a/sk199-posts-get.amd64:1.0
        imagePullPolicy: Always
