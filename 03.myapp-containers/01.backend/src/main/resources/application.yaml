spring:
  application:
    name: myapp
  profiles:
    active: local-mariadb

springdoc:
  api-docs:
    path: /api-docs
    enabled: true
  swagger-ui:
    path: /swagger-ui.html
    enabled: true
    operations-sorter: alpha
    tags-sorter: alpha
    display-request-duration: true
    try-it-out-enabled: true
  show-actuator: false

management:
  server:
    port: 8080 # Actuator 포트 설정
  endpoints:
    web:
      exposure:
        include: "*" # Prometheus endpoint 노출
  endpoint:
    health:
      show-details: always # Health endpoint 상세 정보 노출
      probes:
        enabled: true # LivenessState, ReadinessState 활성화
  health:
    livenessState:
      enabled: true # LivenessState 활성화
    readinessState:
      enabled: true # ReadinessState 활성화
  metrics:
    enable:
      all: true # 모든 기본 메트릭 활성화
    tags:
      application: ${spring.application.name} # 모든 메트릭에 애플리케이션 이름 태그 자동 부착


logging:
  level:
    root: INFO
    '[com.sk.skala.myapp.controller]': DEBUG
    '[com.sk.skala.myapp.service]': DEBUG
