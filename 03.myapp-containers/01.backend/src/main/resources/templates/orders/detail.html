<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org"
      th:replace="~{fragments/layout :: layout('주문 상세', ~{::section})}">
<head><title>주문 상세</title></head>
<body>
<section>
  <div class="page-header d-flex justify-content-between align-items-center">
    <div>
      <nav aria-label="breadcrumb">
        <ol class="breadcrumb">
          <li class="breadcrumb-item"><a th:href="@{/web/orders}">주문 관리</a></li>
          <li class="breadcrumb-item active" th:text="'주문 #' + ${order.orderId}"></li>
        </ol>
      </nav>
      <h2>
        <i class="bi bi-receipt me-2"></i>
        주문 상세 <span class="fs-4 fw-normal text-muted" th:text="'#' + ${order.orderId}"></span>
      </h2>
    </div>
    <!-- 상태 변경 버튼 그룹 -->
    <div class="d-flex gap-2">
      <form th:action="@{/web/orders/{id}/status(id=${order.orderId})}" method="post">
        <input type="hidden" name="status" value="CONFIRMED"/>
        <button type="submit" class="btn btn-sm btn-primary"
                th:disabled="${order.status.name() != 'PENDING'}"
                onclick="return confirm('주문을 확정 처리하시겠습니까?')">
          <i class="bi bi-check2-circle me-1"></i>확정
        </button>
      </form>
      <form th:action="@{/web/orders/{id}/status(id=${order.orderId})}" method="post">
        <input type="hidden" name="status" value="SHIPPED"/>
        <button type="submit" class="btn btn-sm btn-info"
                th:disabled="${order.status.name() != 'CONFIRMED'}"
                onclick="return confirm('배송 처리하시겠습니까?')">
          <i class="bi bi-truck me-1"></i>배송
        </button>
      </form>
      <form th:action="@{/web/orders/{id}/status(id=${order.orderId})}" method="post">
        <input type="hidden" name="status" value="DELIVERED"/>
        <button type="submit" class="btn btn-sm btn-success"
                th:disabled="${order.status.name() != 'SHIPPED'}"
                onclick="return confirm('배송 완료 처리하시겠습니까?')">
          <i class="bi bi-check-all me-1"></i>완료
        </button>
      </form>
      <form th:action="@{/web/orders/{id}/status(id=${order.orderId})}" method="post">
        <input type="hidden" name="status" value="CANCELLED"/>
        <button type="submit" class="btn btn-sm btn-danger"
                th:disabled="${order.status.name() != 'PENDING'}"
                onclick="return confirm('주문을 취소하시겠습니까?')">
          <i class="bi bi-x-circle me-1"></i>취소
        </button>
      </form>
    </div>
  </div>

  <div class="row g-4">
    <!-- 주문 정보 -->
    <div class="col-md-4">
      <div class="card h-100">
        <div class="card-header bg-white">
          <h6 class="mb-0 fw-bold"><i class="bi bi-info-circle me-2 text-primary"></i>주문 정보</h6>
        </div>
        <div class="card-body">
          <dl class="row mb-0">
            <dt class="col-5 text-muted">주문 ID</dt>
            <dd class="col-7 fw-semibold" th:text="'#' + ${order.orderId}">-</dd>

            <dt class="col-5 text-muted">주문자</dt>
            <dd class="col-7 fw-semibold" th:text="${order.userName}">-</dd>

            <dt class="col-5 text-muted">주문 상태</dt>
            <dd class="col-7">
              <span class="badge rounded-pill"
                    th:classappend="'badge-status-' + ${order.status}"
                    th:text="${order.status}"></span>
            </dd>

            <dt class="col-5 text-muted">주문일시</dt>
            <dd class="col-7 small"
                th:text="${#temporals.format(order.orderedAt, 'yyyy-MM-dd HH:mm')}">-</dd>

            <dt class="col-5 text-muted">총 금액</dt>
            <dd class="col-7 fw-bold text-warning fs-5"
                th:text="${#numbers.formatInteger(order.totalPrice, 0, 'COMMA')} + '원'">-</dd>
          </dl>
        </div>
      </div>
    </div>

    <!-- 주문 항목 -->
    <div class="col-md-8">
      <div class="card">
        <div class="card-header bg-white">
          <h6 class="mb-0 fw-bold">
            <i class="bi bi-list-ul me-2 text-warning"></i>주문 항목
            <span class="badge bg-warning text-dark ms-1"
                  th:text="${#lists.size(order.items)} + '종류'"></span>
          </h6>
        </div>
        <div class="card-body p-0">
          <table class="table mb-0">
            <thead>
              <tr>
                <th>상품명</th>
                <th class="text-end">단가</th>
                <th class="text-center">수량</th>
                <th class="text-end">소계</th>
              </tr>
            </thead>
            <tbody>
              <tr th:each="item : ${order.items}">
                <td class="fw-semibold" th:text="${item.productName}">-</td>
                <td class="text-end text-muted"
                    th:text="${#numbers.formatInteger(item.unitPrice, 0, 'COMMA')} + '원'">-</td>
                <td class="text-center">
                  <span class="badge bg-light text-dark border" th:text="${item.quantity} + '개'">-</span>
                </td>
                <td class="text-end fw-bold"
                    th:text="${#numbers.formatInteger(item.subtotal, 0, 'COMMA')} + '원'">-</td>
              </tr>
            </tbody>
            <tfoot class="table-light">
              <tr>
                <td colspan="3" class="text-end fw-bold">합계</td>
                <td class="text-end fw-bold text-warning fs-6"
                    th:text="${#numbers.formatInteger(order.totalPrice, 0, 'COMMA')} + '원'">-</td>
              </tr>
            </tfoot>
          </table>
        </div>
      </div>
    </div>
  </div>

  <div class="mt-3">
    <a th:href="@{/web/orders}" class="btn btn-outline-secondary">
      <i class="bi bi-arrow-left me-1"></i>목록으로
    </a>
  </div>
</section>
</body>
</html>
